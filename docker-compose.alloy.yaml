services:
  site:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace
      - /workspace/node_modules
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      NEXT_TELEMETRY_DISABLED: "1"
    command: bash -lc "npm install --no-audit --no-fund --no-package-lock && ./node_modules/.bin/next dev -H 0.0.0.0 -p 3000"
